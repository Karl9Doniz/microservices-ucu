spring.application.name=messages-service

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.instance-id=${spring.application.name}-${random.uuid}
spring.cloud.consul.discovery.prefer-ip-address=true

spring.cloud.consul.discovery.register-health-check=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=5s
spring.cloud.consul.discovery.health-check-timeout=2s

spring.cloud.consul.discovery.health-check-critical-timeout=30s

spring.cloud.consul.config.enabled=true
spring.cloud.consul.config.prefix=config
spring.cloud.consul.config.format=yaml
spring.cloud.consul.config.data-key=data
spring.cloud.consul.config.default-context=application
spring.cloud.consul.config.name=${spring.application.name}