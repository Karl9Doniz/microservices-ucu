hazelcast:
  cluster-name: logging-cluster

  network:
    port:
      port: 5701
      auto-increment: true
    join:
      multicast:
        enabled: false
      tcp-ip:
        enabled: true
        member-list:
          - 127.0.0.1:5701
          - 127.0.0.1:5702
          - 127.0.0.1:5703

  properties:
    hazelcast.logging.type: slf4j

  metrics:
    enabled: true
